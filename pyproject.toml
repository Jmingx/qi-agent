[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qi-agent"
version = "0.4.23"
description = "从零构建的类 Hermes AI Agent（练手项目）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "psutil>=7.2.2",
    "python-dotenv>=1.0",
    "restrictedpython>=8.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# 排除临时目录（用户测试脚本 tmp/，不进版本库、不参与 lint）
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F"]
